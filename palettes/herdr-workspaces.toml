#:schema ../schemas/vellum.schema.json

[search]
placeholder = "Switch workspace..."

[source]
builtin = "herdr-workspaces"
refresh_ms = 1000

[item]
value = "$workspace_id"
template = [
  [
    { token = "$focus_icon", fg = "#7aa2f7", searchable = false },
    " ",
    { token = "$number", fg = "#565f89", searchable = false },
    "  ",
    { token = "$label", bold = true },
    { token = "$status_icon", fg = "$status_color", searchable = false, align = "right" },
    " ",
    { token = "$agent_status", fg = "$status_color", searchable = false, align = "right" },
  ],
  [
    { token = "󰉋 ", fg = "#7dcfff", searchable = false },
    { token = "$checkout_path", fg = "#a9b1d6" },
    { token = "$pane_label", fg = "#565f89", searchable = false, align = "right" },
  ],
  [
    { token = "$blocked_agents", fg = "#f7768e" },
    "  ",
    { token = "$working_agents", fg = "#7aa2f7" },
    "  ",
    { token = "$done_agents", fg = "#e0af68" },
    "  ",
    { token = "$idle_agents", fg = "#9ece6a" },
    "  ",
    { token = "$unknown_agents", fg = "#565f89" },
    "  ",
    { token = "$agent_summary", fg = "#565f89" },
  ],
]

[theme]
foreground = "#c0caf5"
background = "#1a1b26"
selection_foreground = "#c0caf5"
selection_background = "#283457"
border = "#565f89"
