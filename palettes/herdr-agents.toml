#:schema https://raw.githubusercontent.com/dkarter/vellum/refs/heads/main/schemas/vellum.schema.json

[search]
title = "Agents"
placeholder = "Switch agent..."

[source]
builtin = "herdr-agents"
refresh_ms = 750

[filters]
label = "status"
mode = "ctrl-g"
clear = "a"

[[filters.choices]]
key = "w"
label = "working"
source = "agent_status"
value = "working"
icon = "●"
fg = "yellow"

[[filters.choices]]
key = "d"
label = "done"
source = "agent_status"
value = "done"
icon = "●"
fg = "#89b4fa"

[[filters.choices]]
key = "i"
label = "idle"
source = "agent_status"
value = "idle"
icon = "○"
fg = "#a6e3a1"

[[filters.choices]]
key = "b"
label = "blocked"
source = "agent_status"
value = "blocked"
icon = "●"
fg = "#ff6188"

[[filters.choices]]
key = "u"
label = "unknown"
source = "agent_status"
value = "unknown"
icon = "·"
fg = "#999999"

[item]
value = "$pane_id"
template = [
  [
    { token = "$status_icon", fg = "$status_color", searchable = false },
    " ",
    { token = "$agent", bold = true },
    { token = "$agent_status", fg = "$status_color", searchable = true, align = "right" },
  ],
  [{ token = "$terminal_title_stripped", fg = "#c0caf5" }],
  [
    { token = "󰉋 ", fg = "#7dcfff", searchable = false },
    { token = "$workspace_label", fg = "#7dcfff", bold = true },
    "  ",
    { token = "$cwd", fg = "#565f89" },
  ],
]

[theme]
foreground = "#c0caf5"
background = "#1a1b26"
selection_foreground = "#c0caf5"
selection_background = "#283457"
border = "#565f89"
mode_foreground = "#1a1b26"
insert_mode_background = "#9ece6a"
normal_mode_background = "#e0af68"
