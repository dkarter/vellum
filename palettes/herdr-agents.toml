#:schema https://raw.githubusercontent.com/dorian/vellum/main/schemas/vellum.schema.json

[search]
placeholder = "Switch agent..."

[source]
builtin = "herdr-agents"
refresh_ms = 750

[item]
value = "$pane_id"
template = [
  [
    { token = "$status_icon", fg = "$status_color", searchable = false },
    " ",
    { token = "$agent", bold = true },
    { token = "$agent_status", fg = "$status_color", searchable = false, align = "right" },
  ],
  [{ token = "$terminal_title_stripped", fg = "#c0caf5" }],
  [
    { token = "󰉋 ", fg = "#7dcfff", searchable = false },
    { token = "$workspace_label", fg = "#7dcfff", bold = true },
    "  ",
    { token = "$cwd", fg = "#565f89" },
    { token = "$pane_id", fg = "#565f89", searchable = false, align = "right" },
  ],
]

[theme]
foreground = "#c0caf5"
background = "#1a1b26"
selection_foreground = "#c0caf5"
selection_background = "#283457"
border = "#565f89"
