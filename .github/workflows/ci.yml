name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run tests
        run: cargo +1.97.1 test --locked
