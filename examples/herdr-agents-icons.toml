#:schema https://raw.githubusercontent.com/dkarter/vellum/refs/heads/main/schemas/vellum.schema.json

# This opt-in palette uses private-use agent glyphs from a patched font.
[search]
title = "Agents"
placeholder = "Switch agent..."

[source]
builtin = "herdr-agents"
refresh_ms = 750

[filters]
label = "status"
mode = "ctrl-g"
clear = "a"

[[filters.choices]]
key = "w"
label = "working"
source = "agent_status"
value = "working"
icon = "●"
fg = "yellow"

[[filters.choices]]
key = "d"
label = "done"
source = "agent_status"
value = "done"
icon = "●"
fg = "#89b4fa"

[[filters.choices]]
key = "i"
label = "idle"
source = "agent_status"
value = "idle"
icon = "○"
fg = "#a6e3a1"

[[filters.choices]]
key = "b"
label = "blocked"
source = "agent_status"
value = "blocked"
icon = "●"
fg = "#ff6188"

[[filters.choices]]
key = "u"
label = "unknown"
source = "agent_status"
value = "unknown"
icon = "·"
fg = "#999999"

[item]
value = "$pane_id"
template = [
  [
    { token = "$status_icon", fg = "$status_color", searchable = false },
    " ",
    { token = "$agent_label", bold = true },
    { token = "$agent_status", fg = "$status_color", searchable = true, align = "right" },
  ],
  [{ token = "$terminal_title_stripped", fg = "#c0caf5" }],
  [
    { token = "󰉋 ", fg = "#7dcfff", searchable = false },
    { token = "$workspace_label", fg = "#7dcfff", bold = true },
    "  ",
    { token = "$cwd", fg = "#565f89" },
  ],
]

[[item.tokens]]
name = "agent_label"
source = "agent"
when = ["amp"]
text = " Amp"

[[item.tokens]]
name = "agent_label"
source = "agent"
when = ["claude"]
text = " Claude"

[[item.tokens]]
name = "agent_label"
source = "agent"
when = ["cline"]
text = " Cline"

[[item.tokens]]
name = "agent_label"
source = "agent"
when = ["codex"]
text = " Codex"

[[item.tokens]]
name = "agent_label"
source = "agent"
when = ["copilot"]
text = " Copilot"

[[item.tokens]]
name = "agent_label"
source = "agent"
when = ["cursor"]
text = " Cursor"

[[item.tokens]]
name = "agent_label"
source = "agent"
when = ["gemini"]
