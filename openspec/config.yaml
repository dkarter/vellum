schema: spec-driven

context: |
  Project: Vellum, a Rust and Ratatui terminal palette for multiplexers.

  Runtime: Rust 2024 with Ratatui and Crossterm. Palette definitions are TOML;
  command sources produce JSON arrays or NDJSON objects.

  Tests: Rust unit and integration tests run with Cargo. Test function names begin
  with lowercase OpenSpec scenario IDs, replacing hyphens with underscores.

  Conventions: use safe idiomatic Rust, preserve terminal state, keep palette
  output composable on stdout, and update README.md and the JSON Schema whenever
  user-facing configuration changes.

rules:
  proposal:
    - Keep proposals focused on one user-facing capability or CLI surface.
    - State compatibility and terminal interaction risks explicitly.
  design:
    - Identify configuration, runtime, test, and documentation ownership.
    - Prefer small extensions to the palette model over palette-specific code.
  tasks:
    - Include tests for observable behavior changes.
    - Include interactive Herdr verification for terminal UI changes.
  specs:
    - Use Given/When/Then scenarios.
    - Give every test-backed scenario a stable ID such as `{#CFG-001}`.
    - Start linked Rust test names with the lowercase ID using underscores, such as `cfg_001_`.
