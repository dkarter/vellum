[package]
name = "vellum"
version = "0.1.0"
edition = "2024"
description = "A fast, customizable terminal multiplexer menu"
license = "MIT"
repository = "https://github.com/dorian/vellum"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
unicode-segmentation = "1.12"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
strip = true
