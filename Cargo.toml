[package]
name = "vellum"
version = "1.4.0"
edition = "2024"
description = "A fast, customizable terminal multiplexer menu"
license = "MIT"
repository = "https://github.com/dorian/vellum"
rust-version = "1.91"

[[bin]]
name = "vlm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
json_comments = "0.2.2"
noyalib = "0.0.51"
nucleo-matcher = "0.3"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
toml_edit = "0.25"
unicode-segmentation = "1.12"
usage = { version = "6", package = "usage-rs", features = ["completions"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
strip = true

[target."cfg(unix)".dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process", "fs"] }
